[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "scrna-target-engine"
version = "0.1.0"
description = "Cell-level quicklook engine. It does not perform donor-level inference."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anndata==0.12.19",
  "igraph==1.0.0",
  "leidenalg==0.12.0",
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scanpy==1.11.5",
  "scipy==1.17.1",
  "scrublet==0.2.3",
  "seaborn==0.13.2",
  "gseapy==1.1.13",
  "harmonypy==0.2.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
only-include = ["scripts"]
